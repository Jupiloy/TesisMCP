# TesisMCP — Orquestación de Servicios (PostgreSQL 16, Backend API y Servidor MCP)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tesismcp
      POSTGRES_USER: tesismcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesismcp_local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesismcp -d tesismcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://tesismcp:${POSTGRES_PASSWORD:-tesismcp_local}@postgres:5432/tesismcp
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-solo-desarrollo-docente-cambiar}
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
    command:
      - sh
      - -c
      - python backend/manage.py migrate --noinput && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp:
    build: .
    environment:
      DATABASE_URL: postgresql://tesismcp:${POSTGRES_PASSWORD:-tesismcp_local}@postgres:5432/tesismcp
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-solo-desarrollo-docente-cambiar}
    command: ["python", "-m", "mcp_server.server"]
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["mcp"]

volumes:
  postgres_datos:
